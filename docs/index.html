<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>นับนับ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap');

  /* ===== ธีมอบอุ่นหวานๆ พื้นครีม + พาสเทล — accent ตามเพศ (ชาย=ฟ้า / หญิง=ชมพู) ===== */
  :root {
    --bg: #fbf5ea;          /* พื้นครีมอุ่น */
    --card: #fffdf8;        /* การ์ดขาวนวล */
    --ink: #574a44;         /* ตัวอักษรน้ำตาลอุ่น */
    --muted: #a89b8f;
    --line: #efe6d6;        /* เส้นขอบครีม */
    /* accent เริ่มต้น = ชาย (ฟ้าพาสเทล) */
    --accent: #7cb8e0;
    --accent-dark: #4f93c4;
    --accent-soft: #e7f2fa;
    /* สีสถานะ (อ่อน อบอุ่น) */
    --ok: #4f9c72; --ok-soft: #e6f4ec;
    --warn: #c08a2e; --warn-soft: #fbf0d9;
    --danger: #d6756e; --danger-soft: #fbe8e5;
    /* พาสเทลอุ่น สำหรับจุดต่างๆ */
    --p-peach: #fde8dc; --p-mint: #e4f3e9; --p-blue: #e7f1fb; --p-pink: #fce6ef; --p-lav: #efe9f8; --p-yellow: #fdf3d9;
    /* กล่องไอคอนเล็กในบันทึกรายวัน (คงไว้) */
    --c-coral: #fde3d8; --c-yellow: #fdf1d6; --c-teal: #e3f4ea; --c-blue: #e6f1fb; --c-pink: #fce6ef;
    --shadow-sm: 0 3px 14px -6px rgba(150, 110, 70, .2);
    --r: 22px; --r-sm: 16px;
    --font-b: 'IBM Plex Sans Thai', -apple-system, 'Noto Sans Thai', 'Sukhumvit Set', sans-serif;
    --font-d: var(--font-b);
  }
  body.theme-girl {
    --accent: #ef9ec2;
    --accent-dark: #d76d9c;
    --accent-soft: #fceaf2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-b); color: var(--ink); font-size: 15px; line-height: 1.5;
    background: var(--bg); min-height: 100vh; padding-bottom: 84px; -webkit-font-smoothing: antialiased;
  }

  #topbar {
    position: sticky; top: 0; z-index: 10; padding: 14px 16px 10px;
    display: flex; align-items: center; gap: 10px; background: var(--bg);
  }
  #childSelect {
    font-family: var(--font-b); font-size: 14px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 8px 14px; border-radius: 999px; max-width: 60%; cursor: pointer;
  }
  #childAge {
    color: var(--accent-dark); font-size: 12.5px; font-weight: 700;
    background: var(--accent-soft); padding: 4px 12px; border-radius: 999px;
  }
  #childAge:empty { display: none; }
  #content { padding: 4px 16px 20px; max-width: 640px; margin: 0 auto; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  #tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-around;
    background: rgba(255, 255, 255, .94); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  #tabbar button {
    flex: 1; border: none; background: none; padding: 8px 4px; font-size: 20px;
    color: var(--muted); cursor: pointer; border-radius: 14px; font-family: var(--font-b);
  }
  #tabbar button span { display: block; font-size: 10.5px; margin-top: 2px; font-weight: 600; }
  #tabbar button.active { color: var(--accent-dark); background: var(--accent-soft); }

  /* Hero — minimal ขาว + tint ตามธีม | emoji มุมบนขวา ไม่ทับเนื้อหา */
  .hero {
    background: var(--accent-soft); border: 1px solid var(--line);
    border-radius: var(--r); padding: 20px 84px 18px 20px; color: var(--ink);
    position: relative; overflow: hidden; margin-bottom: 14px;
  }
  .hero::after { content: '👶'; position: absolute; top: 8px; right: 8px; bottom: auto; font-size: 66px; opacity: .55; line-height: 1; }
  .hero.girl::after { content: '👧'; }
  .hero-name { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .hero-age { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
  .hero-chips { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .hero-chip { background: #fff; border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }

  /* ปุ่มปิดแจ้งเตือน */
  .alert-x {
    border: none; background: var(--bg); color: var(--muted); width: 26px; height: 26px;
    border-radius: 50%; font-size: 13px; cursor: pointer; line-height: 1; flex-shrink: 0;
  }
  .alert-x:active { background: var(--line); }

  .card {
    background: var(--card); border-radius: var(--r-sm); padding: 14px;
    margin-bottom: 12px; border: 1px solid var(--line); box-shadow: var(--shadow-sm);
  }
  .card h3 {
    font-size: 15.5px; margin-bottom: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .card h3.left { justify-content: flex-start; }
  /* โน้ตวันนี้ — minimal มีแถบ accent ด้านซ้าย */
  .card.note-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  /* กล่องสถิติ — พาสเทลอุ่น สลับสี (จุดที่ลงพาสเทล) */
  .stat { text-align: center; padding: 12px 4px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--p-peach); }
  .grid3 .stat:nth-child(6n+2) { background: var(--p-mint); }
  .grid3 .stat:nth-child(6n+3) { background: var(--p-blue); }
  .grid3 .stat:nth-child(6n+4) { background: var(--p-pink); }
  .grid3 .stat:nth-child(6n+5) { background: var(--p-lav); }
  .grid3 .stat:nth-child(6n+6) { background: var(--p-yellow); }
  .grid2 .stat:nth-child(4n+2) { background: var(--p-mint); }
  .grid2 .stat:nth-child(4n+3) { background: var(--p-blue); }
  .grid2 .stat:nth-child(4n+4) { background: var(--p-pink); }
  /* สีเฉพาะช่อง (override การสลับสีอัตโนมัติ) */
  .stat.st-peach { background: var(--p-peach) !important; }
  .stat.st-yellow { background: var(--p-yellow) !important; }
  .stat.st-mint { background: var(--p-mint) !important; }
  .stat.st-pink { background: var(--p-pink) !important; }
  .stat.st-lav { background: var(--p-lav) !important; }
  .stat.st-blue { background: var(--p-blue) !important; }
  .stat b { display: block; font-size: 21px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .stat small { color: var(--ink); opacity: .6; font-size: 11.5px; font-weight: 600; }
  .stat-ico { font-size: 20px; display: block; margin-bottom: 2px; }
  .cutoff-note { font-size: 10.5px; font-weight: 500; color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 999px; }
  .std-note { margin-top: 10px; background: var(--accent-soft); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; line-height: 1.7; color: var(--ink); }

  .qbtn {
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 13px 4px; font-size: 13px;
    background: var(--card); color: var(--ink); cursor: pointer; font-family: var(--font-b);
    font-weight: 600; transition: transform .12s;
  }
  .qbtn:active { transform: scale(.96); }

  /* ปุ่ม — ข้อความล้วน, primary ใช้สี accent ตามธีม */
  .btn {
    border: none; border-radius: 999px; padding: 11px 18px; font-size: 14.5px;
    background: var(--accent); color: #fff; cursor: pointer; font-family: var(--font-b);
    font-weight: 600; transition: transform .12s;
  }
  .btn:active { transform: scale(.96); }
  .btn.sm { padding: 6px 13px; font-size: 13px; }
  .btn.gray { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.red { background: #fff; color: var(--danger); border: 1px solid var(--line); }
  .btn.green { background: #fff; color: var(--accent-dark); border: 1px solid var(--line); }

  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .grow { flex: 1; min-width: 0; }
  .row small { color: var(--muted); }

  /* กล่องไอคอนเล็ก (บันทึกรายวัน) — คงสีเดิมตามที่ชอบ */
  .ico-chip { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center; font-size: 19px; }
  .bg-coral { background: var(--c-coral); } .bg-yellow { background: var(--c-yellow); }
  .bg-teal { background: var(--c-teal); } .bg-blue { background: var(--c-blue); } .bg-pink { background: var(--c-pink); }

  .badge { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; white-space: nowrap; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }

  /* checkbox วงกลม — ติ๊กแล้วเป็นสี accent */
  .check { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .check input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--line); background: #fff; cursor: pointer; flex-shrink: 0; margin-top: 1px;
    position: relative; transition: .15s;
  }
  .check input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .check input[type="checkbox"]:checked::after {
    content: '✓'; color: #fff; font-size: 14px; font-weight: 700;
    position: absolute; inset: 0; display: grid; place-items: center;
  }
  .check input[type="checkbox"]:disabled { opacity: .5; cursor: default; }
  .check.done label { color: var(--muted); text-decoration: line-through; }
  .check label { flex: 1; }

  .agehead { font-size: 14px; font-weight: 700; color: var(--accent-dark); padding: 12px 0 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .agehead.current > span:first-child::after { content: ' ●'; color: var(--accent); font-size: 11px; }
  .ms-count { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--bg); padding: 2px 10px; border-radius: 999px; }
  .ms-count.ok { background: var(--ok-soft); color: var(--ok); }

  .seg { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
  .seg button {
    border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; color: var(--muted); cursor: pointer; font-family: var(--font-b);
    font-weight: 500; white-space: nowrap; flex-shrink: 0;
  }
  .seg button.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
  .tabpill {
    border: 1px solid var(--line); background: var(--card); padding: 7px 14px; border-radius: 999px;
    font-size: 12.5px; color: var(--muted); cursor: pointer; font-family: var(--font-b);
    font-weight: 500; white-space: nowrap; flex-shrink: 0;
  }
  .tabpill.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  /* โปรไฟล์ลูก */
  .child-item { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; margin-bottom: 10px; background: var(--bg); }
  .child-item:last-child { margin-bottom: 0; }
  .child-top { display: flex; align-items: center; gap: 10px; }
  .child-top .grow { flex: 1; min-width: 0; }
  .child-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12.5px; color: var(--muted); }
  .child-meta span { white-space: nowrap; }

  /* สมาชิกครอบครัว — ชื่อบรรทัดบน ปุ่มควบคุมบรรทัดล่าง */
  .member { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .member:last-child { border-bottom: none; }
  .member-top { display: flex; align-items: center; gap: 10px; }
  .member-top .grow { flex: 1; min-width: 0; }
  .member-ctrls { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-left: 50px; }
  .member-ctrls .role-select { flex: 1; }
  .member-ctrls .role-select select { width: 100%; }

  /* dropdown สิทธิ์สมาชิก */
  .role-select { position: relative; flex-shrink: 0; }
  .role-select select {
    appearance: none; -webkit-appearance: none; font-family: var(--font-b);
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 30px 8px 14px; cursor: pointer;
  }
  .role-select::after { content: '▾'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); font-size: 12px; }

  /* สินค้าน่าซื้อ */
  .prod-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .prod { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; box-shadow: var(--shadow-sm); }
  .prod-img { height: 100px; width: 100%; object-fit: cover; display: block; background: var(--bg); }
  .prod-ph { height: 100px; width: 100%; display: grid; place-items: center; font-size: 34px; background: var(--bg); }
  .prod-body { padding: 10px 12px 12px; }
  .prod-title { font-size: 13px; font-weight: 500; line-height: 1.35; max-height: 2.7em; overflow: hidden; word-break: break-word; }
  .prod-price { font-weight: 700; font-size: 15px; color: var(--ink); margin-top: 6px; }
  .prod-buys { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .prod-buy { display: block; text-align: center; padding: 7px; font-size: 11.5px; font-weight: 700; border-radius: 999px; text-decoration: none; }
  .prod-buy.plat-shopee { background: #ffede5; color: #ee4d2d; }
  .prod-buy.plat-tiktok { background: #ededed; color: #111; }
  .prod-buy.plat-lazada { background: #e8eaff; color: #2e3192; }
  .prod-tools { display: flex; gap: 6px; margin-top: 8px; }
  .prod-tools button { flex: 1; }

  /* มุมประโยชน์ผู้ปกครอง */
  .benefit-hero {
    background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--r);
    padding: 20px; text-align: center; margin-bottom: 12px;
  }
  .benefit-amt { font-size: 30px; font-weight: 700; color: var(--accent-dark); line-height: 1.1; }
  .benefit-amt span { font-size: 15px; font-weight: 600; opacity: .8; }
  .benefit-sub { font-size: 13px; color: var(--ink); opacity: .75; margin-top: 8px; line-height: 1.6; }
  .benefit-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .benefit-row:last-child { border-bottom: none; }
  .benefit-row span { color: var(--muted); flex-shrink: 0; min-width: 110px; }
  .benefit-row b { flex: 1; font-weight: 600; }
  .step { display: flex; gap: 12px; padding: 9px 0; align-items: flex-start; font-size: 13.5px; line-height: 1.6; }
  .step-n {
    width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }

  /* ประกัน */
  .ins-item { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; margin-bottom: 10px; background: var(--bg); }
  .ins-item:last-child { margin-bottom: 0; }
  .ins-top { display: flex; align-items: center; gap: 10px; }
  .ins-top .grow { flex: 1; min-width: 0; }
  .ins-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); align-items: center; font-size: 12.5px; color: var(--muted); }
  .ins-meta span { flex: 1; min-width: 120px; }
  .ins-btn { background: var(--accent-soft); color: var(--accent-dark); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .ins-tools { display: flex; gap: 6px; margin-top: 10px; }
  .ins-tools button { flex: 1; }

  /* ค่าใช้จ่าย — ซ้ายเลือกเดือน ขวารวมทั้งปี */
  .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; padding: 0 2px; }
  .month-picker { display: flex; align-items: center; gap: 8px; }
  .month-label { font-weight: 700; font-size: 15px; min-width: 74px; text-align: center; }
  .year-total { text-align: right; line-height: 1.3; }
  .year-total small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
  .year-total b { font-size: 15px; color: var(--ink); }
  .bar { height: 5px; background: var(--line); border-radius: 999px; margin-top: 6px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

  #modal { position: fixed; inset: 0; background: rgba(30, 30, 40, .4); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  #modalBox { background: var(--card); border-radius: 26px 26px 0 0; padding: 22px 20px 26px; width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; animation: slideup .3s cubic-bezier(.2, .8, .2, 1); position: relative; }
  #modalBox::before { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; background: var(--line); border-radius: 999px; }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  #modalBox h3 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px;
    font-size: 15px; font-family: var(--font-b); background: #fff; color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .form-sep { font-size: 13px; font-weight: 700; color: var(--ink); margin: 6px 0 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }

  #toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: 90%; }
  .hidden { display: none !important; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; font-size: 14px; }
  /* อัลบั้มความทรงจำ */
  .mem-album { padding: 14px; }
  .mem-head { display: flex; align-items: flex-start; gap: 10px; }
  .mem-head .grow { flex: 1; min-width: 0; }
  .mem-detail { font-size: 13px; color: var(--ink); opacity: .85; display: block; margin-top: 4px; line-height: 1.55; }
  .mem-photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  .mem-photos a { display: block; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--bg); border: 1px solid var(--line); }
  .mem-photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mem-photos .mem-video { display: grid; place-items: center; font-size: 30px; text-decoration: none; }
  canvas { max-width: 100%; }
  pre.routine { white-space: pre-wrap; font-family: var(--font-b); font-size: 14px; line-height: 1.7; color: var(--ink); }

  /* ป้ายอายุ + เพศ ในโปรไฟล์ ตามเพศ (ช=ฟ้า ญ=ชมพู) */
  .badge.b-boy { background: #e7f2fa; color: #4f93c4; }
  .badge.b-girl { background: #fceaf2; color: #d76d9c; }

      function cleanup() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
      function finish(res, errText) {

        if (!res || res.ok === false) { var m = (res && res.error) || 'error'; toast('❌ ' + m); reject(new Error(m)); return; }

        '&userId=' + encodeURIComponent(S.userId || '') +
        '&payload=' + encodeURIComponent(JSON.stringify(payload || {})) +

(async function init() {
  // 1) มี session token จากการ login อีเมล → ใช้ก่อน
  var token = localStorage.getItem('bt_token');
  if (token) {
    S.userId = token;
    try { await startApp(); return; }
    catch (e) {
      localStorage.removeItem('bt_token');
      S.userId = null;
      // token หมดอายุ → เงียบๆ แล้วไปทางอื่นต่อ / error อื่นแสดงบนหน้า login
      if (String(e.message || e).indexOf('SESSION') < 0) { showLogin(e.message || e); return; }
    }
  }
  // 2) เปิดผ่าน LINE (LIFF) → เข้าอัตโนมัติ
  if (LIFF_ID) {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      var p = await liff.getProfile();
      S.userId = p.userId;
      await startApp();
      return;
    } catch (e) { showLogin(e.message || e); return; }
  }
  // 3) เบราว์เซอร์ปกติ → หน้า login อีเมล
  showLogin();
})();

/* อายุแบบ "ปี เดือน วัน" ฝั่ง client (ตรรกะเดียวกับ ageLabelTH ใน GAS) */
function clientAgeTH(birthdate) {
  if (!birthdate) return '';
  var b = new Date(birthdate), now = new Date();
  var y = now.getFullYear() - b.getFullYear();
  var m = now.getMonth() - b.getMonth();
  var d = now.getDate() - b.getDate();
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  var parts = [];
  if (y > 0) parts.push(y + ' ' + t('age_y'));
  if (m > 0) parts.push(m + ' ' + t('age_mo'));
  parts.push(d + ' ' + t('age_d'));
  return parts.join(' ');
}

function updateAgeChip() {
  $('#childAge').textContent = S.child ? clientAgeTH(S.child.birthdate) : '';
}

/* วันของเด็ก (ตัดรอบ 6 โมงเช้า) — ใช้เป็น key ปิดแจ้งเตือนรายวัน */
function clientBabyDay() {
  var d = new Date();
  if (d.getHours() < 6) d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function alertsDismissed() {

/* ---------- modal form ---------- */
function openForm(title, fields, onSubmit, submitLabel) {
  var html = '<h3>' + esc(title) + '</h3>';
  fields.forEach(function (f) {
    if (f.type === 'label') { html += '<div class="form-sep">' + esc(f.label) + '</div>'; return; }
    html += '<div class="field"><label>' + esc(f.label) + '</label>';
    if (f.type === 'select') {
      html += '<select id="f_' + f.key + '">' + f.options.map(function (o) {
        var v = typeof o === 'string' ? o : o.value, l = typeof o === 'string' ? o : o.label;
        return '<option value="' + esc(v) + '"' + (f.value === v ? ' selected' : '') + '>' + esc(l) + '</option>';
      }).join('') + '</select>';
    } else if (f.type === 'textarea') {
      html += '<textarea id="f_' + f.key + '" rows="3">' + esc(f.value || '') + '</textarea>';
    } else if (f.type === 'file') {
      html += '<input type="file" id="f_' + f.key + '" accept="' + (f.accept || 'image/*') + '"' + (f.multiple ? ' multiple' : '') + '>';
    } else {
      html += '<input type="' + (f.type || 'text') + '" id="f_' + f.key + '" value="' + esc(f.value || '') + '"' +
        (f.step ? ' step="' + f.step + '"' : '') + (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + '>';
    }
    html += '</div>';
  });
  html += '<div class="modal-actions"><button class="btn gray" onclick="closeModal()">' + t('cancel') + '</button>' +
    '<button class="btn" id="modalSubmit">' + esc(submitLabel || t('save')) + '</button></div>';
  $('#modalBox').innerHTML = html;
  $('#modal').classList.remove('hidden');
  $('#modalSubmit').onclick = function () {
    var vals = {};
    fields.forEach(function (f) {
      if (f.type === 'label') return;
      var el = $('#f_' + f.key);
      vals[f.key] = f.type === 'file' ? (f.multiple ? Array.prototype.slice.call(el.files) : el.files[0]) : el.value;
    });
    onSubmit(vals);
  };
}
function closeModal() { $('#modal').classList.add('hidden'); }

var homeLogDate;
function fmtISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function logRow(l) {
  return '<div class="row"><span class="ico-chip ' + (LOG_CHIP[l.type] || 'bg-yellow') + '">' + (LOG_ICON[l.type] || '📌') + '</span>' +

    (canEdit() ? btnDel('delLog(\'' + l.id + '\',\'' + esc(l.date || homeLogDate) + '\')') : '') + '</div>';
}
function shiftDayLog(delta) {
  var nd = new Date(homeLogDate); nd.setDate(nd.getDate() + delta);
  var s = fmtISO(nd), today = clientBabyDay();
  if (s > today) return; // ไม่ให้ไปอนาคต
  var back = Math.round((new Date(today) - new Date(s)) / 86400000);
  if (back > (S.retention || 30)) { toast(t('tst_history_limit').replace('{n}', (S.retention || 30))); return; }
  homeLogDate = s; loadDayLogs();
}
function loadDayLogs() {
  var today = clientBabyDay();
  var lbl = $('#dayLogLabel');
  if (lbl) lbl.textContent = homeLogDate === today ? t('today') : fmtD(homeLogDate);
  api('daily.list', { childId: S.child.id, date: homeLogDate }).then(function (logs) {
    var box = $('#dayLogs'); if (!box) return;
    box.innerHTML = logs.length ? logs.slice().reverse().map(logRow).join('') : '<div class="empty">' + t('no_log') + '</div>';
  });
}

    api('list', { sheet: 'GrowthLogs', childId: S.child.id }),
    api('list', { sheet: 'VaccineRecords', childId: S.child.id }),
    api('list', { sheet: 'HealthRecords', childId: S.child.id }),

    api('list', { sheet: 'Appointments', childId: S.child.id })
  ]);
  var growth = results[0].sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
  var vaccines = results[1].sort(function (a, b) { return new Date(a.due_date) - new Date(b.due_date); });
  var health = results[2].sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
  S.health = health;
  S.appointments = results[4].sort(function (a, b) { return new Date(a.date) - new Date(b.date); });

  var latest = growth[growth.length - 1];

  // การ์ดนัดพบแพทย์ — วางล่างสุด (ต่อจากบันทึกสุขภาพ ก่อนวัคซีน)
  var apptHtml = '<div class="card"><h3>🗓 ' + t('appt') + (canEdit() ? '<button class="btn sm" onclick="editAppt()">＋ ' + t('add_appt') + '</button>' : '') + '</h3>';
  var upcoming = S.appointments.filter(function (a) { return new Date(a.date) >= new Date(new Date().toDateString()); });
  if (!upcoming.length) apptHtml += '<div class="empty">' + t('appt_none') + '</div>';
  upcoming.forEach(function (a) {
    var days = Math.ceil((new Date(a.date) - new Date()) / 86400000);
    apptHtml += '<div class="row"><span class="ico-chip bg-blue">🩺</span>' +
      '<div class="grow"><b>' + esc(a.title || t('appt_default')) + '</b> <span class="badge ' + (days <= 2 ? 'warn' : '') + '">' + daysLabel(days) + '</span>' +
      '<br><small>📅 ' + fmtD(a.date) + (a.time ? ' ' + esc(a.time) : '') + (a.place ? ' · 📍 ' + esc(a.place) : '') + '</small></div>' +
      (canEdit() ? btnEdit('editAppt(\'' + a.id + '\')') + btnDel('delAppt(\'' + a.id + '\')') : '') + '</div>';
  });
  apptHtml += '<p style="font-size:12px;color:var(--muted);margin-top:6px">' + t('appt_note') + '</p></div>';
  var pdfHtml = '<button class="btn" id="pdfBtn" style="width:100%" onclick="reportWeekly()">' + t('pdf_btn') + '</button>';

  var html = '<div class="card"><h3>📈 ' + t('growth') +
    (canEdit() ? '<button class="btn sm" onclick="addGrowth()">＋ ' + t('log') + '</button>' : '') + '</h3><div class="grid3">' +
    '<div class="stat st-peach"><b>' + (latest && latest.weight_kg || '-') + '</b><small>' + t('g_weight') + '</small></div>' +
    '<div class="stat st-yellow"><b>' + (latest && latest.height_cm || '-') + '</b><small>' + t('g_height') + '</small></div>' +
    '<div class="stat st-mint"><b>' + (latest && latest.head_cm || '-') + '</b><small>' + t('g_head') + '</small></div>' +
    '<div class="stat st-pink"><b>' + (latest && latest.teeth_count || '-') + '</b><small>' + t('g_teeth') + '</small></div>' +
    '<div class="stat st-lav"><b>' + (latest && latest.shirt_size || '-') + '</b><small>' + t('g_shirt') + '</small></div>' +
    '<div class="stat st-blue"><b>' + (latest && latest.shoe_size || '-') + '</b><small>' + t('g_shoe') + '</small></div>' +
    '</div></div>';

  html += '<div class="card"><h3>' + t('chart_w') + '</h3><canvas id="wChart"></canvas></div>';
  html += '<div class="card"><h3>' + t('chart_h') + '</h3><canvas id="hChart"></canvas></div>';

  // คำอธิบายวิธีอ่านกราฟ + แหล่งที่มา (ให้ตรงกับหน้าตากราฟจริง)
  var isGirlG = String(S.child.gender || '').indexOf('หญิง') >= 0 || /^f/i.test(String(S.child.gender || ''));
  var genderTxt = isGirlG ? t('gender_girl') : t('gender_boy');
  var whoLink = '<a href="https://www.who.int/tools/child-growth-standards" target="_blank" rel="noopener" style="color:var(--accent-dark)">who.int/tools/child-growth-standards</a>';
  html += '<div class="card"><h3>' + t('gg_title') + '</h3>' +
    '<p style="font-size:13.5px;line-height:1.9">' +
    t('gg_p1') + '<br>' + t('gg_band') + '<br>' + t('gg_p50') + '<br>' +
    t('gg_line').replace('{name}', esc(S.child.nickname || S.child.name)) + '</p>' +
    '<p style="font-size:13.5px;line-height:1.9;margin-top:8px">' +
    t('gg_ok') + '<br>' + t('gg_warn') + '</p>' +
    '<p style="font-size:12.5px;line-height:1.8;margin-top:8px;background:var(--accent-soft);padding:8px 10px;border-radius:10px">' +
    t('gg_gender').replace('{gender}', genderTxt) + '</p>' +
    '<p style="font-size:12px;color:var(--muted);margin-top:10px">' + t('gg_source').replace('{url}', whoLink) + '</p></div>';

  // วัคซีน — เพิ่มเอง/ลบได้ + แยกวัคซีนเสริม (ซื้อเพิ่ม) | เก็บไว้ต่อท้าย (ก่อนปุ่มปริ้น)
  var vaccineHtml = '<div class="card"><h3>💉 ' + t('vaccine') + (canEdit() ? '<button class="btn sm" onclick="addVaccine()">＋ ' + t('add_vaccine') + '</button>' : '') + '</h3>';
  vaccines.forEach(function (v) {
    var done = v.status === 'done';
    var days = Math.ceil((new Date(v.due_date) - new Date()) / 86400000);
    var opt = String(v.optional) === 'optional';
    vaccineHtml += '<div class="row"><div class="grow">' + esc(v.vaccine) +
      (opt ? ' <span class="badge warn">' + t('vac_buy') + '</span>' : '') +
      '<br><small>' + (done ? t('vac_given') + ' ' + fmtD(v.given_date) + (v.place ? ' @ ' + esc(v.place) : '') : t('due_on') + ' ' + fmtD(v.due_date)) + '</small></div>' +
      (done ? '<span class="badge ok">' + t('vac_done') + '</span>'
        : (canEdit() ? '<button class="btn sm green" onclick="markVaccine(\'' + v.id + '\')">' + t('vac_mark') + '</button>' : '<span class="badge ' + (days < 0 ? 'danger' : '') + '">' + t('vac_wait') + '</span>')) +
      (canEdit() ? btnDel('delVaccine(\'' + v.id + '\')') : '') +
      '</div>';
  });
  vaccineHtml += '<p style="font-size:12px;color:var(--muted);margin-top:8px">' + t('vac_note') + '</p>';
  vaccineHtml += '</div>';

  // ข้อมูลสุขภาพพื้นฐาน (จากโปรไฟล์ — แก้ที่ตั้งค่า)

  // บันทึกสุขภาพ (รายการเจ็บป่วย/ทำฟัน/ตรวจ ตามเหตุการณ์)

      (canEdit() ? btnEdit('editHealth(\'' + h.id + '\')') + btnDel('delHealth(\'' + h.id + '\')') : '') + '</div>';

  // ลำดับล่างสุด: นัดพบแพทย์ → วัคซีน → ปุ่มปริ้น
  html += apptHtml + vaccineHtml + pdfHtml;

  $('#content').innerHTML = html;
  drawGrowthChart('wChart', 'weight', growth, 'weight_kg', t('g_weight'));
  drawGrowthChart('hChart', 'height', growth, 'height_cm', t('g_height'));

function drawGrowthChart(canvasId, metric, growth, field, label) {
  var gender = (S.child.gender || 'M').toUpperCase().indexOf('F') >= 0 || S.child.gender === 'หญิง' ? 'F' : 'M';
  var std = S.refs.growthStd.filter(function (r) { return r.gender === gender && r.metric === metric; })
    .sort(function (a, b) { return a.age_m - b.age_m; });
  var birth = new Date(S.child.birthdate);
  var pts = growth.filter(function (g) { return g[field]; }).map(function (g) {
    return { x: (new Date(g.date) - birth) / (86400000 * 30.4375), y: Number(g[field]) };
  });
  var chart = new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: {
      datasets: [
        // P97 เติมสีลงมาถึง P3 = แถบช่วงเกณฑ์ปกติ (range)
        { label: t('chart_leg_band'), data: std.map(function (r) { return { x: r.age_m, y: r.p97 }; }),
          borderColor: 'rgba(150,150,160,.25)', backgroundColor: 'rgba(150,150,160,.12)',
          borderWidth: 1, pointRadius: 0, fill: '+2' },
        { label: t('chart_leg_p50'), data: std.map(function (r) { return { x: r.age_m, y: r.p50 }; }),
          borderColor: '#b6b6be', borderWidth: 2, pointRadius: 0, borderDash: [6, 4] },
        { label: 'P3', data: std.map(function (r) { return { x: r.age_m, y: r.p3 }; }),
          borderColor: 'rgba(150,150,160,.25)', borderWidth: 1, pointRadius: 0 },
        { label: esc(S.child.nickname || S.child.name), data: pts, borderColor: accentColor(), backgroundColor: accentColor(), borderWidth: 3, pointRadius: 4, tension: .3 }
      ]
    },
    options: {
      scales: { x: { type: 'linear', title: { display: true, text: t('chart_axis_age') } }, y: { title: { display: true, text: label } } },
      plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 }, filter: function (i) { return i.text !== 'P3'; } } } }
    }
  });
  S.charts.push(chart);
}

var devTab = 'milestone';
async function pageDevelop() {
  if (needChild()) return;
  await getRefs();
  var html = '<div class="seg">' +
    '<button class="' + (devTab === 'milestone' ? 'active' : '') + '" onclick="devTab=\'milestone\';pageDevelop()">' + t('seg_check') + '</button>' +
    '<button class="' + (devTab === 'activity' ? 'active' : '') + '" onclick="devTab=\'activity\';pageDevelop()">' + t('seg_activity') + '</button>' +
    '<button class="' + (devTab === 'school' ? 'active' : '') + '" onclick="devTab=\'school\';pageDevelop()">' + t('seg_school') + '</button>' +
    '</div><div id="devBody"><div class="loading">' + t('loading') + '</div></div>';
  $('#content').innerHTML = html;

  if (devTab === 'milestone') await renderMilestones();
  else if (devTab === 'activity') renderActivities();
  else await renderSchoolPrep();
}

async function renderMilestones() {
  var checks = await api('milestone.list', { childId: S.child.id });
  var checked = {}; checks.forEach(function (c) { checked[c.milestone_id] = true; });
  var d = await api('dashboard', { childId: S.child.id });
  var months = Math.floor(d.ageMonths);

  var groups = {};
  S.refs.milestones.forEach(function (m) {
    (groups[m.age_label] = groups[m.age_label] || { from: m.age_from_m, to: m.age_to_m, items: [] }).items.push(m);
  });
  var DOMAIN = { GM: t('dom_gm'), FM: t('dom_fm'), RL: t('dom_rl'), EL: t('dom_el'), PS: t('dom_ps') };

  var html = '<div class="card">';
  var gi = 0;
  Object.keys(groups).forEach(function (label) {
    var g = groups[label];
    var isCurrent = months >= g.from && months <= g.to;
    var done = g.items.filter(function (m) { return checked[m.id]; }).length;
    var allDone = done === g.items.length;
    // ช่วงที่ติ๊กครบ = หุบไว้ (ยกเว้นตั้งใจกดเปิด) | ช่วงปัจจุบันเปิดเสมอ
    var collapsed = allDone && !isCurrent && !S.msOpen[label];
    var gid = 'ms_g' + (gi++);
    html += '<div class="agehead' + (isCurrent ? ' current' : '') + '" onclick="toggleMsGroup(\'' + esc(label).replace(/'/g, '') + '\',\'' + gid + '\')" style="cursor:pointer">' +
      '<span>' + (collapsed ? '▸' : '▾') + ' ' + esc(ageRangeLabel(g.from, g.to, label)) + '</span>' +
      '<span class="ms-count' + (allDone ? ' ok' : '') + '">' + (allDone ? t('ms_done') : done + '/' + g.items.length) + '</span></div>';
    html += '<div id="' + gid + '"' + (collapsed ? ' class="hidden"' : '') + '>';
    g.items.forEach(function (m) {
      html += '<div class="check' + (checked[m.id] ? ' done' : '') + '">' +
        '<input type="checkbox" ' + (checked[m.id] ? 'checked' : '') + (canEdit() ? '' : ' disabled') +
        ' onchange="toggleMs(\'' + m.id + '\')">' +
        '<label>' + esc(m.item) + '<br><small style="color:var(--muted)">' + (DOMAIN[m.domain] || m.domain) + '</small></label></div>';
    });
    html += '</div>';
  });
  html += '</div><p style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px;line-height:1.7">' + t('ms_note') + '</p>';
  $('#devBody').innerHTML = html;
}

function toggleMsGroup(label, gid) {
  S.msOpen[label] = !S.msOpen[label];
  var el = document.getElementById(gid);
  if (el) el.classList.toggle('hidden');
  var head = el && el.previousElementSibling && el.previousElementSibling.querySelector('span');
  if (head) head.textContent = head.textContent.replace(/^[▸▾]/, el.classList.contains('hidden') ? '▸' : '▾');
}

function toggleMs(id) {
  api('milestone.toggle', { childId: S.child.id, milestoneId: id }).then(function (r) {
    toast(r.checked ? t('ms_checked') : t('ms_unchecked'));
  });
}

function renderActivities() {
  var months = Math.floor((new Date() - new Date(S.child.birthdate)) / (86400000 * 30.4375));
  var acts = S.refs.activities.filter(function (a) { return months >= a.age_from_m && months <= a.age_to_m; });
  var others = S.refs.activities.filter(function (a) { return !(months >= a.age_from_m && months <= a.age_to_m); });
  var html = '<div class="card"><h3>🎯 ' + t('r_act_reco') + '</h3>';
  if (!acts.length) html += '<div class="empty">' + t('e_no_age_data') + '</div>';
  acts.forEach(function (a) {
    html += '<div class="row"><div class="grow"><b>' + esc(a.title) + '</b> <span class="badge">' + esc(a.category) + '</span><br><small>' + esc(a.detail) + '</small></div></div>';
  });
  html += '</div><div class="card"><h3>' + t('r_act_other') + '</h3>';
  others.forEach(function (a) {
    html += '<div class="row"><div class="grow">' + esc(a.title) + ' <span class="badge">' + a.age_from_m + '-' + a.age_to_m + ' ด.</span><br><small>' + esc(a.detail) + '</small></div></div>';

    (canEdit() ? '<button class="btn sm" onclick="addPrep()">＋ ' + t('add_vaccine') + '</button>' : '') + '</h3>';
  // รายการ default (จากระบบ) — เฉพาะระดับอนุบาล

  customs.forEach(function (p) {
    var done = String(p.done) === '1';
    html += '<div class="check' + (done ? ' done' : '') + '">' +
      '<input type="checkbox" ' + (done ? 'checked' : '') + (canEdit() ? '' : ' disabled') +
      ' onchange="toggleCustomPrep(\'' + p.id + '\',' + (done ? 'false' : 'true') + ')">' +

var expenseMonth = null; // 'yyyy-MM' — null = เดือนปัจจุบัน
function shiftMonth(base, delta) {
  var parts = base.split('-'); var d = new Date(Number(parts[0]), Number(parts[1]) - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthLabelTH(m) {
  var TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var p = m.split('-');
  return (LANG === 'en' ? EN : TH)[Number(p[1]) - 1] + ' ' + yearLabel(Number(p[0]));
}
/** ปี: ไทยใช้ พ.ศ. / อังกฤษใช้ ค.ศ. */
function yearLabel(y) { return Number(y) + (LANG === 'en' ? 0 : 543); }

async function renderExpense() {
  var month = expenseMonth || thisMonthStr();
  var results = await Promise.all([
    api('expense.summary', { childId: S.child.id, month: month }),
    api('list', { sheet: 'Expenses', childId: S.child.id })
  ]);
  var sum = results[0];
  var all = results[1];
  var list = all.filter(function (e) { return String(e.date).indexOf(month) === 0; })
    .sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
  var isThisMonth = month === thisMonthStr();
  var year = month.slice(0, 4);
  var yearTotal = all.filter(function (e) { return String(e.date).indexOf(year) === 0; })
    .reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);

  // แถบเลือกเดือน (ซ้าย) + ' + t('year_total') + ' (ขวา) บรรทัดเดียวกัน
  var html = '<div class="month-nav">' +
    '<div class="month-picker">' +
    '<button class="btn sm gray icon-btn" onclick="expenseMonth=\'' + shiftMonth(month, -1) + '\';renderExpense()">‹</button>' +

/* อัปโหลดไฟล์ทีละไฟล์เข้าอัลบั้ม (memoryId) แบบเรียงลำดับ */
function uploadPhotos(memoryId, files, i, done) {
  i = i || 0;
  if (i >= files.length) { done(); return; }
  var f = files[i];
  if (f.size > 8 * 1024 * 1024) { toast(t('tst_skip_big').replace('{name}', f.name)); uploadPhotos(memoryId, files, i + 1, done); return; }
  var reader = new FileReader();
  reader.onload = function () {
    toast(t('tst_uploading').replace('{i}', (i + 1)).replace('{n}', files.length));
    api('memory.addPhoto', { memoryId: memoryId, base64: reader.result.split(',')[1], mimeType: f.type, filename: f.name })
      .then(function () { uploadPhotos(memoryId, files, i + 1, done); });
  };
  reader.readAsDataURL(f);
}

    { key: 'link', label: t('fl_media_link'), value: '', placeholder: 'https://...' }
  ], function (v) {
    var links = v.link ? [v.link] : [];
    // บันทึก metadata ก่อน (ได้ id) แล้วค่อยอัปโหลดรูปเข้าอัลบั้ม

        api('save', { sheet: 'Memories', record: { id: memId, media_url: existing.concat(links).join('\n'), media_type: 'album' } }).then(afterLinks);
      } else afterLinks();

      '<div class="grow">' + (row && row.menu
        ? esc(row.menu) + (row.ingredients ? '<br><small style="color:var(--muted)">' + t('ing_lbl') + esc(row.ingredients) + '</small>' : '')
        : '<small style="color:var(--muted)">' + t('undefined_menu') + '</small>') + '</div>' +
      (canEdit() ? '<button class="btn sm gray" onclick="editMeal(\'' + meal + '\')">' + (row && row.menu ? t('edit') : t('add')) + '</button>' : '') + '</div>';
  });
  html += '</div>';

  $('#moreBody').innerHTML = html || '<div class="empty">' + t('e_no_age_data') + '</div>';
}

function editRoutine(id) {
  var r = id ? (S.routines || []).filter(function (x) { return x.id === id; })[0] || {} : {};
  openForm(id ? t('ft_slot_edit') : t('ft_slot_add'), [
    { key: 'time', label: t('fl_time'), type: 'time', value: r.time || '' },
    { key: 'activity', label: t('fl_activity'), value: r.activity, placeholder: t('ph_activity') },
    { key: 'note', label: t('fl_note_opt'), value: r.note, placeholder: t('ph_act_note') }
  ], function (v) {
    if (!v.time || !v.activity) { toast(t('err_time_act')); return; }
    if (id) v.id = id;
    v.child_id = S.child.id;
    api('save', { sheet: 'CustomRoutines', record: v }).then(function () {
      closeModal(); toast(id ? t('tst_edited') : t('added')); renderRoutine();
    });
  });
}
function addRoutine() { editRoutine(); }
function delRoutine(id) {
  if (!confirm(t('cf_del_slot'))) return;
  api('delete', { sheet: 'CustomRoutines', id: id }).then(function () { renderRoutine(); });
}

function editFav(id) {
  var f = id ? (S.favfoods || []).filter(function (x) { return x.id === id; })[0] || {} : {};
  openForm(id ? t('ft_food_edit') : t('ft_food_add'), [
    { key: 'food', label: t('fl_food_name'), value: f.food, placeholder: t('ph_food') },
    { key: 'pref', label: t('fl_preference'), type: 'select', options: enumOpts(['ชอบ', 'ไม่ชอบ', 'แพ้']), value: f.pref },
    { key: 'note', label: t('fl_note_opt'), value: f.note }
  ], function (v) {
    if (!v.food) { toast(t('err_food')); return; }
    if (id) v.id = id;
    v.child_id = S.child.id;
    api('save', { sheet: 'FavFoods', record: v }).then(function () { closeModal(); toast(t('saved')); renderRoutine(); });
  });
}
function delFav(id) {
  if (!confirm(t('cf_del_item'))) return;
  api('delete', { sheet: 'FavFoods', id: id }).then(function () { renderRoutine(); });
}

function editMeal(meal) {
  var row = (S.mealplan || []).filter(function (r) { return Number(r.day) === mealDay && r.meal === meal; })[0];
  openForm(t('ft_meal').replace('{meal}', mealLabel(meal)).replace('{day}', DAY_LABEL(mealDay)), [
    { key: 'menu', label: t('fl_menu'), type: 'textarea', value: row ? row.menu : '', placeholder: t('ph_meal') },
    { key: 'ingredients', label: t('fl_ingredients'), type: 'textarea', value: row ? row.ingredients : '', placeholder: t('ph_ingredients') }
  ], function (v) {
    var rec = row ? { id: row.id, menu: v.menu, ingredients: v.ingredients } : { child_id: S.child.id, day: mealDay, meal: meal, menu: v.menu, ingredients: v.ingredients };
    api('save', { sheet: 'WeekMealPlan', record: rec }).then(function () { closeModal(); toast(t('tst_menu')); renderRoutine(); });
  });
}

async function renderSchool() {
  if (!S.child) { $('#moreBody').innerHTML = '<div class="empty">' + t('e_add_child_first') + '</div>'; return; }
  var results = await Promise.all([
    api('list', { sheet: 'Schools', childId: S.child.id }),
    api('list', { sheet: 'Homework', childId: S.child.id })
  ]);
  var schools = results[0], hw = results[1].filter(function (h) { return h.status !== 'done'; });
  S.schools = results[0]; S.homework = results[1];

  var html = '<div class="card"><h3>🏫 ' + t('r_school') + ' ' + (canEdit() ? '<button class="btn sm" onclick="addSchool()">＋ ' + t('add') + '</button>' : '') + '</h3>';
  if (!schools.length) html += '<div class="empty">' + t('e_no_school') + '</div>';
  schools.forEach(function (s) {
    html += '<div class="row"><div class="grow"><b>' + esc(s.school_name) + '</b> <span class="badge">' + esc(levelLabel(s.level)) + '</span>' +
      '<br><small>' + t('lbl_teacher') + esc(s.teacher || '-') + t('lbl_contact') + esc(s.contact || '-') + '</small>' +
      (s.schedule_note ? '<br><small>' + esc(s.schedule_note) + '</small>' : '') + '</div>' +
      (canEdit() ? '<div style="display:flex;gap:6px;flex-shrink:0">' + btnEdit('editSchool(\'' + s.id + '\')') + btnDel('delSchool(\'' + s.id + '\')') + '</div>' : '') + '</div>';
  });
  html += '</div><div class="card"><h3>📚 ' + t('r_homework') + ' ' + (canEdit() ? '<button class="btn sm" onclick="addHomework()">＋ ' + t('add') + '</button>' : '') + '</h3>';
  if (!hw.length) html += '<div class="empty">' + t('e_no_homework') + '</div>';
  hw.sort(function (a, b) { return new Date(a.due_date) - new Date(b.due_date); }).forEach(function (h) {
    html += '<div class="row"><div class="grow">' + esc(h.title) + (h.subject ? ' <span class="badge">' + esc(h.subject) + '</span>' : '') +
      '<br><small>' + t('lbl_submit_hw') + fmtD(h.due_date) + '</small></div>' +
      (canEdit() ? '<button class="btn sm green" onclick="doneHomework(\'' + h.id + '\')"' + t('btn_done_hw') + '</button>' + btnEdit('editHomework(\'' + h.id + '\')') + btnDel('delHomework(\'' + h.id + '\')') : '') + '</div>';
  });
  html += '</div>';
  $('#moreBody').innerHTML = html;
}

function editSchool(id) {
  var s = id ? (S.schools || []).filter(function (x) { return x.id === id; })[0] || {} : {};
  openForm(id ? t('ft_school_edit') : t('ft_school_add'), [
    { key: 'level', label: t('fl_level'), type: 'select', options: SCHOOL_LEVELS.map(function (v) { return { value: v, label: levelLabel(v) }; }), value: s.level },
    { key: 'school_name', label: t('fl_school_name'), value: s.school_name },
    { key: 'teacher', label: t('fl_teacher'), value: s.teacher },
    { key: 'contact', label: t('fl_contact'), value: s.contact },
    { key: 'schedule_note', label: t('fl_schedule_note'), type: 'textarea', value: s.schedule_note }
  ], function (v) {
    if (id) v.id = id;
    v.child_id = S.child.id;
    api('save', { sheet: 'Schools', record: v }).then(function () { closeModal(); toast(t('saved')); renderSchool(); });
  });
}
function addSchool() { editSchool(); }
function delSchool(id) {
  if (!confirm(t('cf_del_school'))) return;
  api('delete', { sheet: 'Schools', id: id }).then(function () { renderSchool(); });
}

function editHomework(id) {
  var h = id ? (S.homework || []).filter(function (x) { return x.id === id; })[0] || {} : {};
  openForm(id ? t('ft_hw_edit') : t('ft_hw_add'), [
    { key: 'title', label: t('fl_homework'), value: h.title },
    { key: 'subject', label: t('fl_subject_hw'), value: h.subject },
    { key: 'due_date', label: t('fl_due'), type: 'date', value: h.due_date ? String(h.due_date).slice(0, 10) : todayStr() }
  ], function (v) {
    if (id) v.id = id; else v.status = 'todo';
    v.child_id = S.child.id;
    api('save', { sheet: 'Homework', record: v }).then(function () { closeModal(); toast(t('saved')); renderSchool(); });
  });
}
function addHomework() { editHomework(); }
function delHomework(id) {
  if (!confirm(t('cf_del_homework'))) return;
  api('delete', { sheet: 'Homework', id: id }).then(function () { renderSchool(); });
}

function doneHomework(id) {
  api('save', { sheet: 'Homework', record: { id: id, status: 'done' } }).then(function () { toast(t('tst_hw_done')); renderSchool(); });
}

async function renderSetting() {
  // ---------- ส่วนที่ไม่ต้องใช้ API: แสดงทันที (ไม่บล็อก) ----------
  var html = '<div class="card"><h3>🌐 ' + t('set_lang') + '</h3>' +
    '<div class="seg" style="margin-bottom:0">' +
    '<button class="' + (LANG === 'th' ? 'active' : '') + '" onclick="setLang(\'th\')">ไทย</button>' +
    '<button class="' + (LANG === 'en' ? 'active' : '') + '" onclick="setLang(\'en\')">English</button>' +
    '</div></div>';

   

  html += '<div class="card"><h3>👶 ' + t('profile') + (canEdit() ? '<button class="btn sm" onclick="editChild()">＋ ' + t('add_child') + '</button>' : '') + '</h3>';



  S.children.forEach(function (c) {
   
    var isGirl = String(c.gender || '').indexOf('หญิง') >= 0;
    html += '<div class="child-item">' +
      '<div class="child-top">' +
      '<span class="ico-chip ' + (isGirl ? 'bg-pink' : 'bg-blue') + '">' + (isGirl ? '👧' : '👶') + '</span>' +
      '<div class="grow"><b>' + esc(c.nickname || c.name) + '</b> <span class="badge ' + (isGirl ? 'b-girl' : 'b-boy') + '">' + clientAgeTH(c.birthdate) + '</span>' +
      '<br><small>' + esc(c.name) + '</small></div>' +
      (canEdit() ? btnEdit('editChild(\'' + c.id + '\')') : '') +
      '</div>' +
      '<div class="child-meta">' +
      '<span>🎂 ' + fmtD(c.birthdate) + '</span><span class="' + (isGirl ? 'gcol-girl' : 'gcol-boy') + '" style="font-weight:700">' + (isGirl ? '♀' : '♂') + ' ' + esc(enumLabel(c.gender) || '-') + '</span>' +
      '<span>🩸 ' + esc(c.blood_group || '-') + '</span><span>🏥 ' + esc(c.hospital || '-') + '</span>' +
      '<span>📞 ' + esc(c.emergency_contact || '-') + '</span>' +
      '</div></div>';
  });
  html += '</div>';

  

  // บัญชีเข้าสู่ระบบของตัวเอง
  html += '<div class="card"><h3>🔐 ' + t('login_sec') + '</h3>' +
    '<div class="row"><div class="grow">' + esc(S.user.name) + ' <span class="badge">' + esc(S.user.role) + '</span>' +
    '<br><small>' + (S.user.email ? esc(S.user.email) : t('no_email_hint')) + '</small></div>' +
    '<button class="btn sm gray" onclick="setCredentialsForm(\'' + S.user.id + '\')">' + (S.user.email ? t('change_pass') : t('set_pass')) + '</button></div>' +
    '<p style="font-size:12px;color:var(--muted);margin-top:6px">' + t('login_note') + '</p>' +
    (localStorage.getItem('bt_token') ? '<button class="btn red" style="width:100%;margin-top:10px" onclick="logout()">' + t('logout') + '</button>' : '') +
    '</div>';

   

  // ที่ว่างสำหรับส่วนที่ต้องโหลดผ่าน API (settings + members)
  html += '<div id="setExtra"></div>';


  $('#moreBody').innerHTML = html; // << แสดงทันที ไม่รอ API

  // ---------- ส่วนที่ต้องใช้ API: โหลดทีหลัง ไม่บล็อกหน้า ----------
  var extra = '';
  if (canEdit()) {
    try {
      var st = await api('settings.get');
      extra += '<div class="card"><h3>🗂 ' + t('set_retention') + '</h3>' +
        '<p style="font-size:12.5px;color:var(--muted);margin-bottom:10px">' + t('retention_hint') + '</p>' +
        '<div class="seg" style="margin-bottom:0">' +
        [7, 15, 30].map(function (n) {
          return '<button class="' + (Number(st.logRetentionDays) === n ? 'active' : '') + '" onclick="setRetention(' + n + ')">' + n + ' ' + t('days_unit') + '</button>';
        }).join('') + '</div></div>';
      extra += '<div class="card"><h3>🔔 ' + t('set_remind') + '</h3>' +
        '<p style="font-size:12.5px;color:var(--muted);margin-bottom:8px">' + t('remind_lead') + '</p>' +
        '<div class="seg" style="margin-bottom:12px">' +
        [1, 3, 7].map(function (n) {
          return '<button class="' + (Number(st.remindDays) === n ? 'active' : '') + '" onclick="setRemind(\'remindDays\',' + n + ')">' + t('before_n_days').replace('{n}', n) + '</button>';
        }).join('') + '</div>' +
        '<p style="font-size:12.5px;color:var(--muted);margin-bottom:8px">' + t('remind_time') + '</p>' +
        '<div class="seg" style="margin-bottom:12px">' +
        ['09:00', '17:00'].map(function (tm) {
          return '<button class="' + (st.remindTime === tm ? 'active' : '') + '" onclick="setRemind(\'remindTime\',\'' + tm + '\')">' + tm + '</button>';
        }).join('') + '</div>' +
        '<div style="background:var(--accent-soft);padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.9">' +
        '<b>' + t('remind_funcs') + '</b><br>' +
        '🗓 ' + t('rf_appt') + '<br>💉 ' + t('rf_vaccine') + '<br>📦 ' + t('rf_stock') + '<br>🛡 ' + t('rf_insurance') + '<br>📚 ' + t('rf_homework') + '</div></div>';
    } catch (e) { /* โหลด settings ไม่ได้ ก็ข้ามไป ไม่ให้หน้าพัง */ }
  }
  if (S.user.role === 'admin') {
    try {
      var users = await api('users.list');
      var mHtml = '<div class="card"><h3>👥 ' + t('members') + '</h3>';
      var ROLE_TH = { admin: t('role_admin'), editor: t('role_editor'), logger: t('role_logger'), viewer: t('role_viewer'), pending: t('role_pending') };
      users.forEach(function (u) {
        var isSelf = String(u.id) === String(S.user.id);
        mHtml += '<div class="member">' +
          '<div class="member-top">' +
          '<span class="ico-chip bg-yellow">' + (u.picture_url ? '<img src="' + esc(u.picture_url) + '" style="width:100%;height:100%;object-fit:cover;border-radius:12px">' : '🙋') + '</span>' +
          '<div class="grow"><b>' + esc(u.name) + '</b>' + (isSelf ? ' <span class="badge">' + t('you') + '</span>' : '') +
          (u.email ? '<br><small>' + esc(u.email) + '</small>' : '') + '</div>' +
          '</div>' +
          '<div class="member-ctrls">' +
          '<div class="role-select"><select onchange="setRole(\'' + u.id + '\', this.value)">' +
          ['admin', 'editor', 'logger', 'viewer', 'pending'].map(function (r) {
            return '<option value="' + r + '"' + (u.role === r ? ' selected' : '') + '>' + ROLE_TH[r] + '</option>';
          }).join('') + '</select></div>' +
          '<button class="btn sm gray" onclick="setCredentialsForm(\'' + u.id + '\',\'' + esc(u.name) + '\')">' + t('pass_short') + '</button>' +
          (isSelf ? '' : btnDel('removeUser(\'' + u.id + '\',\'' + esc(u.name) + '\')')) +
          '</div></div>';
      });
      mHtml += '<p style="font-size:12px;color:var(--muted);margin-top:8px">' + t('members_note') + '</p></div>';
      extra += mHtml;
    } catch (e) { /* โหลด members ไม่ได้ ก็ข้ามไป */ }
  }
  var box = $('#setExtra'); if (box) box.innerHTML = extra;
}

function setRole(userId, role) {
  api('user.setRole', { targetId: userId, role: role }).then(function () { toast(t('tst_role')); });
}

function setRetention(n) {
  api('settings.set', { logRetentionDays: n }).then(function () { toast(t('tst_retention').replace('{n}', n)); renderSetting(); });
}
function setRemind(key, val) {
  var patch = {}; patch[key] = val;
  api('settings.set', patch).then(function () { toast(t('tst_remind')); renderSetting(); });
}

function removeUser(userId, name) {
  if (!confirm(t('cf_del_member').replace('{name}', name))) return;
  api('user.remove', { targetId: userId }).then(function () { toast(t('tst_member_rm')); renderSetting(); });
}

function setCredentialsForm(targetId, name) {
  openForm(t('ft_cred') + (name ? ' — ' + name : ''), [
    { key: 'email', label: t('email'), type: 'email', placeholder: 'you@email.com' },
    { key: 'password', label: t('fl_pass_min'), type: 'password' },
    { key: 'confirm', label: t('fl_pass_confirm'), type: 'password' }
  ], function (v) {
    if (v.password !== v.confirm) { toast(t('err_pass_match')); return; }
    api('user.setCredentials', { targetId: targetId, email: v.email, password: v.password })
      .then(function () {
        closeModal(); toast(t('tst_pass_set'));
        if (targetId === S.user.id) S.user.email = v.email;
        renderSetting();
      });
  });
}

function editChild(id) {
  var c = id ? S.children.find(function (x) { return x.id === id; }) : {};
  openForm(id ? t('ft_child_edit') : t('ft_child_add'), [
    { key: 'name', label: t('fl_fullname'), value: c.name },
    { key: 'nickname', label: t('fl_nickname'), value: c.nickname },
    { key: 'gender', label: t('fl_gender'), type: 'select', options: enumOpts(['ชาย', 'หญิง']), value: c.gender },
    { key: 'birthdate', label: t('fl_birthdate'), type: 'date', value: c.birthdate ? String(c.birthdate).slice(0, 10) : '' },
    { key: 'blood_group', label: t('fl_blood'), type: 'select', options: ['', 'A', 'B', 'AB', 'O'], value: c.blood_group },
    { key: 'hospital', label: t('fl_hospital'), value: c.hospital },
    { key: 'doctor', label: t('fl_doctor'), value: c.doctor },
    { key: 'emergency_contact', label: t('fl_emergency'), value: c.emergency_contact },
    { key: 'allergies', label: t('fl_allergy_hist'), type: 'textarea', value: c.allergies },
    { key: 'diseases', label: t('fl_disease'), type: 'textarea', value: c.diseases }
  ], function (v) {
    if (id) v.id = id;
    api('save', { sheet: 'Children', record: v }).then(function (saved) {
      closeModal(); toast(id ? t('tst_edited') : t('tst_child_added'));
      return api('bootstrap');
    }).then(function (boot) {
      S.children = boot.children;
      if (!S.child) S.child = S.children[0];
      applyTheme(); renderChildSelect(); renderSetting();
    });
  });
}
</script>
